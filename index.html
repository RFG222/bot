<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Мой Дашборд</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #000000;
            --widget-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: #8e8e93;
            --accent-work: #ff9f0a;  /* Оранжевый - работа */
            --accent-study: #bf5af2; /* Фиолетовый - учеба */
            --accent-home: #32d74b;  /* Зеленый - дом */
            --accent-other: #64d2ff; /* Голубой - другое */
        }
        body {
            margin: 0; padding: 16px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .widget {
            background-color: var(--widget-bg);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.1s ease;
        }
        .widget:active { transform: scale(0.98); }
        .widget-large { grid-column: span 2; align-items: center; text-align: center; }
        
        .time { font-size: 42px; font-weight: bold; margin: 0; }
        .date { color: var(--text-sub); font-size: 14px; margin-top: 2px; }
        .countdown { margin-top: 10px; font-size: 13px; background: rgba(255,255,255,0.1); padding: 6px 12px; border-radius: 10px; }
        
        .widget-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; display: flex; justify-content: space-between; }
        
        /* График дней */
        .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; width: 100%; }
        .day-card { 
            background: rgba(255,255,255,0.08); text-align: center; padding: 8px 2px; 
            border-radius: 8px; font-size: 11px; font-weight: bold; display: flex; flex-direction: column; gap: 4px;
        }
        .day-tag { font-size: 9px; padding: 2px; border-radius: 4px; background: rgba(255,255,255,0.1); }
        
        /* Модальное окно выбора темы */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
            align-items: center; justify-content: center; z-index: 100;
        }
        .modal-content {
            background: var(--widget-bg); border-radius: 20px; padding: 20px; width: 80%; text-align: center;
        }
        .btn-option {
            width: 100%; padding: 12px; margin: 8px 0; border: none; border-radius: 12px;
            font-size: 16px; font-weight: bold; color: white; cursor: pointer;
        }
        .btn-work { background: var(--accent-work); }
        .btn-study { background: var(--accent-study); }
        .btn-home { background: var(--accent-home); }
        .btn-other { background: var(--accent-other); }
    </style>
</head>
<body>

    <div class="dashboard">
        <!-- ГЛАВНЫЙ ВИДЖЕТ -->
        <div class="widget widget-large">
            <h1 class="time" id="clock">00:00</h1>
            <p class="date" id="date-display">Загрузка...</p>
            <div class="countdown" id="countdown-btn">🎯 Важная дата: Нажми для настройки</div>
        </div>

        <!-- ГРАФИК (7 ДНЕЙ) -->
        <div class="widget widget-large">
            <div class="widget-title">График недели <span>📅</span></div>
            <div class="days-grid" id="days-container">
                <!-- Дни будут сгенерированы автоматически скриптом -->
            </div>
        </div>

        <!-- ВАЖНОЕ -->
        <div class="widget">
            <div class="widget-title">Важное 📌</div>
            <p style="font-size: 12px; color: var(--text-sub);" id="important-preview">Заметок нет</p>
        </div>

        <!-- ЗАМЕТКИ -->
        <div class="widget">
            <div class="widget-title">Заметки 📝</div>
            <p style="font-size: 12px; color: var(--text-sub);">Быстрые записи</p>
        </div>

        <!-- БОТ-КОПИЛКА -->
        <div class="widget widget-large">
            <div class="widget-title">Копилка из чата 📥</div>
            <p style="font-size: 12px; color: var(--text-sub);">Всё, что ты отправляешь в бот, сохраняется здесь.</p>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ВЫБОРА РЕЖИМА -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">Выбери тему дня</h3>
            <button class="btn-option btn-work" onclick="selectTheme('Работа')">💼 Работа</button>
            <button class="btn-option btn-study" onclick="selectTheme('Учеба')">🎓 Учеба</button>
            <button class="btn-option btn-home" onclick="selectTheme('Дом')">🏠 Дом</button>
            <button class="btn-option btn-other" onclick="selectTheme('Другое')">✨ Другое</button>
            <button style="background:transparent; border:none; color:var(--text-sub); margin-top:10px;" onclick="closeModal()">Отмена</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const daysNames = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];
        let selectedDayIndex = null;
        let scheduleData = JSON.parse(localStorage.getItem('schedule')) || {};

        // Часы и дата
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'});
            document.getElementById('date-display').innerText = now.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Генерация дней недели
        function renderDays() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';
            
            daysNames.forEach((day, index) => {
                const theme = scheduleData[index] || 'Свободно';
                let colorClass = 'var(--text-sub)';
                if(theme === 'Работа') colorClass = 'var(--accent-work)';
                if(theme === 'Учеба') colorClass = 'var(--accent-study)';
                if(theme === 'Дом') colorClass = 'var(--accent-home)';
                if(theme === 'Другое') colorClass = 'var(--accent-other)';

                const dayCard = document.createElement('div');
                dayCard.className = 'day-card';
                dayCard.onclick = () => openModal(index);
                dayCard.innerHTML = `
                    <div>${day}</div>
                    <div class="day-tag" style="color: ${colorClass}">${theme}</div>
                `;
                container.appendChild(dayCard);
            });
        }

        function openModal(index) {
            selectedDayIndex = index;
            document.getElementById('modal-title').innerText = `Тема на ${daysNames[index]}`;
            document.getElementById('modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        function selectTheme(themeName) {
            if (themeName === 'Другое') {
                const custom = prompt("Введи свою тему дня:");
                if (custom) scheduleData[selectedDayIndex] = custom;
            } else {
                scheduleData[selectedDayIndex] = themeName;
            }
            
            // Сохраняем локально и в облако Telegram
            localStorage.setItem('schedule', JSON.stringify(scheduleData));
            if (tg.CloudStorage) {
                tg.CloudStorage.setItem('schedule', JSON.stringify(scheduleData));
            }
            
            renderDays();
            closeModal();
        }

        renderDays();
    </script>
</body>
</html>
