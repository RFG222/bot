<!DOCTYPE html>
<html lang="ru" data-theme="minimal">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Dashboard</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* CSS ТЕМЫ И ПЕРЕМЕННЫЕ */
    :root[data-theme="minimal"] {
      --bg-main: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-primary: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #475569;
      --accent-active: #64748b;
      --success: #10b981;
      --danger: #ef4444;
      --input-bg: #0f172a;
    }

    :root[data-theme="nordic-light"] {
      --bg-main: #f8fafc;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --text-primary: #0f172a;
      --text-muted: #64748b;
      --accent: #e2e8f0;
      --accent-active: #cbd5e1;
      --success: #059669;
      --danger: #dc2626;
      --input-bg: #f1f5f9;
    }

    :root[data-theme="calm-sage"] {
      --bg-main: #18221c;
      --card-bg: #222e26;
      --card-border: #324338;
      --text-primary: #f0fdf4;
      --text-muted: #86efac;
      --accent: #2e3e33;
      --accent-active: #3e5244;
      --success: #34d399;
      --danger: #f87171;
      --input-bg: #18221c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      padding: 16px;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .theme-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: transform 0.1s ease, background-color 0.2s ease;
    }

    .theme-btn:active {
      transform: scale(0.96);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.2s ease;
    }

    .card-title {
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 500;
    }

    /* Таймер и часы */
    .clock-display {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .countdown-display {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Формы и инпуты */
    input, textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text-primary);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.2s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--text-muted);
    }

    button.btn-action {
      width: 100%;
      background: var(--accent);
      border: none;
      color: var(--text-primary);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.2s ease;
    }

    button.btn-action:active {
      transform: scale(0.98);
      background: var(--accent-active);
    }

    /* Список задач */
    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--card-border);
    }

    .task-item:last-child {
      border-bottom: none;
    }

    .task-text {
      font-size: 14px;
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-delete {
      background: transparent;
      border: none;
      color: var(--danger);
      font-size: 13px;
      cursor: pointer;
      padding: 4px 8px;
    }

    /* Календарь */
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
      text-align: center;
      margin-top: 10px;
    }

    .cal-day-head {
      font-size: 11px;
      color: var(--text-muted);
      padding-bottom: 4px;
    }

    .cal-day {
      padding: 8px 0;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      background: var(--input-bg);
      transition: transform 0.1s ease;
    }

    .cal-day:active {
      transform: scale(0.92);
    }

    .cal-day.today {
      border: 1px solid var(--text-muted);
      font-weight: 600;
    }

    /* Заметки */
    .note-item {
      background: var(--input-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .note-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .note-body {
      font-size: 13px;
      color: var(--text-muted);
      display: none;
      margin-top: 6px;
      white-space: pre-wrap;
    }

    .note-item.open .note-body {
      display: block;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="title">Панель управления</div>
    <button class="theme-btn" onclick="toggleTheme()">Тема: Минимал</button>
  </div>

  <!-- Часы и обратный отсчет -->
  <div class="card">
    <div class="card-title">Текущее время</div>
    <div class="clock-display" id="clock">00:00:00</div>
    <div class="countdown-display" id="countdown">Загрузка...</div>
  </div>

  <!-- Список важных дел -->
  <div class="card">
    <div class="card-title">Задачи</div>
    <div style="display: flex; gap: 8px;">
      <input type="text" id="taskInput" placeholder="Новая задача..." onkeypress="if(event.key==='Enter') addTask()">
      <button class="btn-action" style="width: auto; padding: 0 16px;" onclick="addTask()">Добавить</button>
    </div>
    <div id="taskList" style="margin-top: 10px;"></div>
  </div>

  <!-- Календарь -->
  <div class="card">
    <div class="card-title" id="calendarMonth">Календарь</div>
    <div class="calendar-grid" id="calendarGrid"></div>
  </div>

  <!-- Редактор заметок -->
  <div class="card">
    <div class="card-title">Заметки</div>
    <input type="text" id="noteTitle" placeholder="Заголовок">
    <textarea id="noteContent" rows="3" placeholder="Текст заметки..."></textarea>
    <button class="btn-action" onclick="saveNote()">Сохранить заметку</button>
    <div id="notesList" style="margin-top: 12px;"></div>
  </div>

  <script>
    // Инициализация Telegram WebApp API
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    // Вспомогательная функция вибраций (Haptic Feedback)
    function haptic(type, style = 'light') {
      if (!tg?.HapticFeedback) return;
      if (type === 'impact') tg.HapticFeedback.impactOccurred(style);
      if (type === 'notification') tg.HapticFeedback.notificationOccurred(style);
      if (type === 'selection') tg.HapticFeedback.selectionChanged();
    }

    // ТЕМЫ ОФОРМЛЕНИЯ
    const themes = [
      { id: 'minimal', name: 'Тема: Минимал' },
      { id: 'nordic-light', name: 'Тема: Светлая' },
      { id: 'calm-sage', name: 'Тема: Шалфей' }
    ];
    let currentThemeIdx = 0;

    function applyTheme(themeId) {
      document.documentElement.setAttribute('data-theme', themeId);
      localStorage.setItem('selected_theme', themeId);
      const themeObj = themes.find(t => t.id === themeId);
      if (themeObj) {
        document.querySelector('.theme-btn').innerText = themeObj.name;
      }
    }

    function toggleTheme() {
      haptic('selection');
      currentThemeIdx = (currentThemeIdx + 1) % themes.length;
      applyTheme(themes[currentThemeIdx].id);
    }

    // Загрузка сохраненной темы
    const savedTheme = localStorage.getItem('selected_theme');
    if (savedTheme) {
      currentThemeIdx = themes.findIndex(t => t.id === savedTheme);
      if (currentThemeIdx === -1) currentThemeIdx = 0;
      applyTheme(savedTheme);
    }

    // ЧАСЫ И ТАЙМЕР
    function updateTime() {
      const now = new Date();
      document.getElementById('clock').innerText = now.toLocaleTimeString('ru-RU');

      // Пример обратного отсчета (до конца текущего дня)
      const endOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
      const diff = Math.floor((endOfDay - now) / 1000);
      const hours = Math.floor(diff / 3600);
      const mins = Math.floor((diff % 3600) / 60);
      const secs = diff % 60;
      document.getElementById('countdown').innerText = `До конца дня: ${hours}ч ${mins}м ${secs}с`;
    }
    setInterval(updateTime, 1000);
    updateTime();

    // ЗАДАЧИ
    let tasks = JSON.parse(localStorage.getItem('dashboard_tasks') || '[]');

    function renderTasks() {
      const container = document.getElementById('taskList');
      container.innerHTML = '';
      tasks.forEach((t, i) => {
        const item = document.createElement('div');
        item.className = 'task-item';
        item.innerHTML = `
          <span class="task-text ${t.done ? 'done' : ''}" onclick="toggleTask(${i})">${t.text}</span>
          <button class="btn-delete" onclick="deleteTask(${i})">Удалить</button>
        `;
        container.appendChild(item);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      if (!input.value.trim()) return;
      tasks.push({ text: input.value.trim(), done: false });
      localStorage.setItem('dashboard_tasks', JSON.stringify(tasks));
      input.value = '';
      renderTasks();
      haptic('notification', 'success'); // Вибрация при сохранении
    }

    function toggleTask(index) {
      tasks[index].done = !tasks[index].done;
      localStorage.setItem('dashboard_tasks', JSON.stringify(tasks));
      renderTasks();
      haptic('impact', 'light');
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      localStorage.setItem('dashboard_tasks', JSON.stringify(tasks));
      renderTasks();
      haptic('notification', 'warning'); // Вибрация при удалении
    }
    renderTasks();

    // КАЛЕНДАРЬ
    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      const monthTitle = document.getElementById('calendarMonth');
      grid.innerHTML = '';

      const now = new Date();
      const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
      monthTitle.innerText = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;

      const daysHeader = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
      daysHeader.forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-day-head';
        h.innerText = d;
        grid.appendChild(h);
      });

      const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
      const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      
      let offset = firstDay === 0 ? 6 : firstDay - 1;
      for (let i = 0; i < offset; i++) {
        grid.appendChild(document.createElement('div'));
      }

      for (let day = 1; day <= totalDays; day++) {
        const dEl = document.createElement('div');
        dEl.className = 'cal-day' + (day === now.getDate() ? ' today' : '');
        dEl.innerText = day;
        dEl.onclick = () => haptic('impact', 'light');
        grid.appendChild(dEl);
      }
    }
    renderCalendar();

    // ЗАМЕТКИ
    let notes = JSON.parse(localStorage.getItem('dashboard_notes') || '[]');

    function renderNotes() {
      const container = document.getElementById('notesList');
      container.innerHTML = '';
      notes.forEach((n, i) => {
        const item = document.createElement('div');
        item.className = 'note-item';
        item.onclick = (e) => {
          if (e.target.tagName === 'BUTTON') return;
          item.classList.toggle('open');
          haptic('impact', 'light'); // Вибрация при открытии блока
        };
        item.innerHTML = `
          <div style="display:flex; justify-between; align-items:center;">
            <div class="note-title">${n.title}</div>
            <button class="btn-delete" onclick="deleteNote(${i})">Удалить</button>
          </div>
          <div class="note-body">${n.content}</div>
        `;
        container.appendChild(item);
      });
    }

    function saveNote() {
      const title = document.getElementById('noteTitle');
      const content = document.getElementById('noteContent');
      if (!title.value.trim() && !content.value.trim()) return;

      notes.unshift({ title: title.value.trim() || 'Без названия', content: content.value.trim() });
      localStorage.setItem('dashboard_notes', JSON.stringify(notes));
      title.value = '';
      content.value = '';
      renderNotes();
      haptic('notification', 'success'); // Вибрация при сохранении
    }

    function deleteNote(index) {
      notes.splice(index, 1);
      localStorage.setItem('dashboard_notes', JSON.stringify(notes));
      renderNotes();
      haptic('notification', 'warning'); // Вибрация при удалении
    }
    renderNotes();
  </script>
</body>
</html>
